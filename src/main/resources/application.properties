# NNland: local NetBeans + MySQL. Private values may be placed in application-local.properties.
spring.application.name=NNland
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
spring.config.import=optional:classpath:application-local.properties,optional:file:./application-local.properties
server.port=${SERVER_PORT:8081}
server.servlet.session.timeout=60m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-stacktrace=never
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/nnland?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.schema-locations=classpath:nnland-schema.sql
spring.mvc.view.prefix=/WEB-INF/views/nnland/
spring.mvc.view.suffix=.jsp
spring.mvc.format.date=yyyy-MM-dd
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=16MB
spring.jackson.time-zone=Asia/Ho_Chi_Minh
server.tomcat.uri-encoding=UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
nnland.base-url=${NNLAND_BASE_URL:http://localhost:8081}
nnland.seed-data=${NNLAND_SEED_DATA:true}
nnland.demo-accounts=${NNLAND_DEMO_ACCOUNTS:true}
nnland.mail.enabled=${MAIL_ENABLED:false}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
nnland.mail.from=${MAIL_FROM:no-reply@nnland.local}
logging.level.com.javaweb.nnland=INFO

spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED
