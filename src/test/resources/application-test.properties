spring.datasource.url=${NNLAND_TEST_DATABASE_URL:jdbc:h2:mem:nnland;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
spring.datasource.driver-class-name=${NNLAND_TEST_DATABASE_DRIVER:org.h2.Driver}
spring.datasource.username=${NNLAND_TEST_DATABASE_USER:sa}
spring.datasource.password=${NNLAND_TEST_DATABASE_PASSWORD:}
nnland.seed-data=true
nnland.demo-accounts=true
nnland.mail.enabled=false
nnland.scheduling.enabled=false
nnland.upload-dir=${java.io.tmpdir}/nnland-test-uploads
logging.level.root=WARN
